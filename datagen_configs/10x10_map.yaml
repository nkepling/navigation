#Data gen config parameters for a 5x5 map

#Experiments parameters
dataset_name: "10x10_map"
#n_train: 1000
#n_test: 500
n_train: 10000
n_test: 2000
num_workers: 30
max_steps: 300

num_reward_variants: 5

#Environment parameters
n: 10 
rewards_config: "block"
min_obstacles: 2
max_obstacles: 5 

num_reward_blocks: [2,5]
